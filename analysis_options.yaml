include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
  exclude:
    - build/**
    # Separate packages with their own pubspec, analysis_options and CI job.
    # Analyzing them from the root fails when their dependencies are not
    # resolved (e.g. `package:dio` in CI).
    - example/**
    - packages/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - unawaited_futures
    - unnecessary_lambdas
    - use_super_parameters
