name: api_studio
description: "In-app API inspector for Flutter: capture Dio, http or custom requests with redaction, edit & replay, cURL/HAR/Postman export, performance monitor and cloud logs."
version: 1.1.0
homepage: https://github.com/princesaini-dev/api_studio
repository: https://github.com/princesaini-dev/api_studio
issue_tracker: https://github.com/princesaini-dev/api_studio/issues
topics:
  - network
  - debugging
  - http
  - inspector
  - devtools

screenshots:
  - description: API Inspector request list
    path: assets/ss1.png
  - description: Request detail overview
    path: assets/ss2.png
  - description: Performance Inspector
    path: assets/ss7.png
  - description: File Explorer
    path: assets/ss6.png

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  equatable: ">=2.1.0 <4.0.0"
  hive_ce: ^2.19.3
  path_provider: ^2.1.5
  share_plus: ">=12.0.2 <14.0.0"
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"
  mocktail: ^1.0.4
  path_provider_platform_interface: ^2.1.2
